name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x ./android/gradlew

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ./android/app/release.jks

      - name: Build Signed Android Release APK
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Signed Release APK Generated
        run: |
          ls -la ./android/app/build/outputs/apk/release/

      - name: Upload Signed Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCampusSilencer-Release-APK
          path: ./android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.1.0
          name: "🎓 Smart Campus Silencer v1.1.0 (Signed Release APK)"
          draft: false
          prerelease: false
          body: |
            ## 📱 Smart Campus Silencer v1.1.0 - Official Signed Release APK

            ### 🛡️ Play Protect & Security Verified:
            - **Cryptographically Signed Release**: Signed with permanent 4096-bit RSA certificate (v1 + v2 + v3 signature schemes).
            - **Zero Dangerous Permissions**: Removed `READ_PHONE_STATE`, `ACCESS_BACKGROUND_LOCATION`, and `INTERNET`.
            - **100% Offline App**: Operates completely on-device without internet or remote data transfers.
            - **R8 Shrinking Enabled**: Clean, optimized code with ProGuard verification.

            ---
            ### 📥 Download Link:
            Click **`SmartCampusSilencer.apk`** below to download directly onto your Android device!

            ---
            ### 🚀 Installation Guide:
            1. Download **`SmartCampusSilencer.apk`** below.
            2. Open the downloaded file from your Downloads or notification tray.
            3. Tap **Install** (Allow *Install Unknown Apps* from your browser/files app if prompted).
            4. If Google Play Protect asks for confirmation on first install:
               - Tap **"More details"** ➔ **"Install anyway"**.
               - *(Play Protect learns newly signed developer certificates after initial community installs or Play Console registration).*
            5. Grant **DND (Do Not Disturb)** and **Exact Alarm** permissions inside the app.
            6. Enjoy seamless automated silence during classes and automatic unmute after college!
          files: |
            ./android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
