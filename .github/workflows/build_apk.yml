name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x ./android/gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generated
        run: |
          ls -la ./android/app/build/outputs/apk/debug/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCampusSilencer-APK
          path: ./android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: "🎓 Smart Campus Silencer (Direct APK Download)"
          draft: false
          prerelease: false
          body: |
            ## 📱 Smart Campus Silencer - Official APK Release
            
            ### 📥 Download Link:
            Click **`SmartCampusSilencer.apk`** below to download directly onto your mobile phone!
            
            ---
            ### 🚀 How to Install on Android:
            1. Download **`SmartCampusSilencer.apk`** below.
            2. Open the downloaded file from mobile Downloads or notification.
            3. Tap **Install** (Allow *Install Unknown Apps* if prompted).
            4. Grant **DND (Do Not Disturb) Permission** in app.
            5. Select your preferred mode:
               - **Option 1**: 📡 Mobile Cell Tower Shield (Zero GPS, Zero Wi-Fi)
               - **Option 2**: 🔔 Morning Smart Notify / Departure Check
               - **Option 3**: 🗓️ One-Time Location & Auto State Holidays + Custom Timetable
          files: |
            ./android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
