name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x ./android/gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generated
        run: |
          ls -la ./android/app/build/outputs/apk/debug/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCampusSilencer-APK
          path: ./android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: "🎓 Smart Campus Silencer v1.0.0 (Direct APK)"
          draft: false
          prerelease: false
          body: |
            ## 📱 Smart Campus Silencer - Mobile Direct Download
            
            ### 📥 Download Link:
            Click **`app-debug.apk`** below to download directly onto your Android phone!
            
            ---
            ### 🚀 How to Install on Android Phone:
            1. Download the **`app-debug.apk`** file below.
            2. Open the downloaded file from your mobile notifications or Downloads folder.
            3. If prompted, enable **"Allow from this source"** / **"Install unknown apps"**.
            4. Tap **Install** and open **Smart Campus Silencer**!
            5. Grant **DND (Do Not Disturb) Access** and click **"Start Background Geofencing"**.
            
            ---
            ### ✨ Core Features:
            - 🎯 **GPS Geofencing**: Automatically switches phone to Silent/Vibrate upon entering college campus.
            - 🏡 **Auto Restore at Home**: Instantly restores normal ringing volume when you get back home.
            - 🏖️ **Taking Leave Today**: One-tap pause so your phone NEVER mutes on sick leaves or holidays.
            - 📶 **College Wi-Fi Trigger**: Instant zero-battery-drain muting.
            - ⚡ **C++ Native Geo Engine**: Ultra-low battery consumption.
          files: |
            ./android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
